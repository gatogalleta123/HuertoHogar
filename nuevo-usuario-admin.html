<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin - Inicio</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Componente: Nuevo Usuario -->
    
    <div class="container-fluid p-0">
    
        <div class="d-flex min-vh-100">
    
    
            <!-- Barra lateral -->
            <div class="bg-light border-end p-3" style="width: 220px;">
    
                <!-- Logo -->
                <div class="mb-4 pb-3 border-bottom">
                    <h1 class="mb-0">
                        🌱 Huerto Hogar
                    </h1>
                </div>
    
    
                <!-- Menú -->
                <ul class="nav nav-pills flex-column gap-2">
    
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            📊 Dashboard
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            📦 Productos
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            🛒 Pedidos
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a href="#" class="nav-link active">
                            👤 Usuarios
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            👥 Clientes
                        </a>
                    </li>
    
                </ul>
    
    
                <!-- Menú inferior -->
                <div class="mt-5 pt-5">
    
                    <ul class="nav nav-pills flex-column gap-2">
    
                        <li class="nav-item">
                            <a href="#" class="nav-link text-dark">
                                ⚙️ Configuración
                            </a>
                        </li>
    
                        <li class="nav-item">
                            <a href="#" class="nav-link text-dark">
                                🔔 Notificaciones
                            </a>
                        </li>
    
                        <li class="nav-item">
                            <a href="#" class="nav-link text-dark">
                                🔍 Buscar
                            </a>
                        </li>
    
                        <li class="nav-item">
                            <a href="#" class="nav-link text-dark">
                                🚪 Cerrar sesión
                            </a>
                        </li>
    
                    </ul>
    
                </div>
    
    
                <!-- Usuario -->
                <div class="border-top mt-4 pt-3">
    
                    <div class="d-flex align-items-center gap-2">
    
                        <span class="fs-5">👤</span>
    
                        <div>
    
                            <small class="fw-semibold d-block">
                                Administrador
                            </small>
    
                            <small class="text-muted">
                                Admin
                            </small>
    
                        </div>
    
                    </div>
    
                </div>
    
            </div>
    
    
            <!-- Contenido principal -->
            <main class="flex-grow-1 p-4">
    
                <h1 class="h3 mb-4">
                    NUEVO USUARIO
                </h1>
    
    
                <!-- Formulario -->
                <div class="card">
    
                    <div class="card-body p-4">
    
                        <form id="formNuevoUsuario">
    
    
                            <!-- Datos personales -->
                            <div class="bg-light p-2 mb-3">
    
                                <strong>
                                    Datos del usuario
                                </strong>
    
                            </div>
    
    
                            <!-- Nombre -->
                            <div class="mb-3">
    
                                <label for="nombre" class="form-label">
                                    Nombre completo
                                </label>
    
                                <input type="text" class="form-control" id="nombre" required>
    
                            </div>
    
    
                            <!-- Correo -->
                            <div class="mb-3">
    
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>
    
                                <input type="email" class="form-control" id="correo" required>
    
                            </div>
    
    
                            <!-- RUT -->
                            <div class="mb-3">
    
                                <label for="rut" class="form-label">
                                    RUT
                                </label>
    
                                <input type="text" class="form-control" id="rut" placeholder="12.345.678-9" required>
    
                            </div>
    
    
                            <!-- Teléfono -->
                            <div class="mb-3">
    
                                <label for="telefono" class="form-label">
                                    Teléfono
                                </label>
    
                                <input type="tel" class="form-control" id="telefono">
    
                            </div>
    
    
                            <!-- Contraseña -->
                            <div class="mb-3">
    
                                <label for="password" class="form-label">
                                    Contraseña
                                </label>
    
                                <input type="password" class="form-control" id="password" required>
    
                            </div>
    
    
                            <!-- Confirmar contraseña -->
                            <div class="mb-4">
    
                                <label for="confirmarPassword" class="form-label">
                                    Confirmar contraseña
                                </label>
    
                                <input type="password" class="form-control" id="confirmarPassword" required>
    
                            </div>
    
    
                            <!-- Rol y estado -->
                            <div class="row g-3 mb-4">
    
                                <!-- Rol -->
                                <div class="col-md-6">
    
                                    <label for="rol" class="form-label">
                                        Rol
                                    </label>
    
                                    <select id="rol" class="form-select" required>
    
                                        <option value="">
                                            Seleccione un rol
                                        </option>
    
                                        <option value="cliente">
                                            Cliente
                                        </option>
    
                                        <option value="administrador">
                                            Administrador
                                        </option>
    
                                    </select>
    
                                </div>
    
    
                                <!-- Estado -->
                                <div class="col-md-6">
    
                                    <label for="estado" class="form-label">
                                        Estado
                                    </label>
    
                                    <select id="estado" class="form-select" required>
    
                                        <option value="">
                                            Seleccione un estado
                                        </option>
    
                                        <option value="activo">
                                            Activo
                                        </option>
    
                                        <option value="inactivo">
                                            Inactivo
                                        </option>
    
                                    </select>
    
                                </div>
    
                            </div>
    
    
                            <!-- Botón -->
                            <div class="text-center mt-5">
    
                                <button type="submit" class="btn btn-success px-5">
                                    REGISTRAR
                                </button>
    
                            </div>
    
                        </form>
    
                    </div>
    
                </div>
    
            </main>
    
        </div>
    
    </div>
</body>


<!-- JavaScript -->
<script>

    function nuevoUsuario() {

        alert("Abrir formulario para crear un nuevo usuario.");

    }


    function editarUsuario(id) {

        alert("Editar usuario con ID: " + id);

    }


    function eliminarUsuario(id) {

        const confirmar = confirm(
            "¿Deseas eliminar el usuario " + id + "?"
        );

        if (confirmar) {

            alert("Usuario eliminado.");

        }

    }


    function filtrarUsuarios() {

        const filtro =
            document.getElementById("filtroUsuarios").value;

        const usuarios =
            document.querySelectorAll("#tablaUsuarios tr");


        usuarios.forEach(function (usuario) {

            const rol =
                usuario.getAttribute("data-rol");


            if (filtro === "todos" || rol === filtro) {

                usuario.style.display = "";

            } else {

                usuario.style.display = "none";

            }

        });

    }

</script>



</html>
