    </style>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
</head>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Huerto Hogar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                <a class="nav-link" href="#">Iniciar Sesion/Registrarse</a>
                <a class="nav-link" href="#">Perfil</a>
                <a class="nav-link" href="#">Catalogo</a>
                <a class="nav-link" href="#">Carrito</a>
            </div>
        </div>
    </div>
</nav>

<body>
    <div class="contenedor">
        <div class="caja-login">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div>
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <div>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">Ingresar</button>
            </form>
        </div>
    </div>
</body>

<footer>
    <div class="footer-menu">
        <div>
            <h1>HuertoHogar</h1>
            <h5>Del Campo Al Hogar</h5>
        </div>
        <div>
            <p>Contacto: contacto@huertohogar.cl</p>
            <p>Teléfono: +56 9 xxxx xxxx</p>
        </div>
        <div>
            <p>Redes: </p>
            <a>Instagram</a>
            <a>X/twitter</a>            
            <a>Facebook</a>
        </div>
    </div>
</footer>

</html>
